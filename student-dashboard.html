<!DOCTYPE html>
<html>
<head>
    <title>Lifa K - Student Management Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .form-box, .table-box {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        input, select {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .delete-btn {
            background-color: #c0392b;
        }

        .edit-btn {
            background-color: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        .search-box {
            width: 90%;
            padding: 12px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            table {
                font-size: 12px;
            }

            input, select {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Lifa K's Student Management Dashboard</h1>
    <p>Student Data Management System</p>
</header>

<div class="container">

    <div class="form-box">
        <h2>Add Student</h2>

        <input type="text" id="name" placeholder="Student Name">

        <input type="text" id="roll" placeholder="Roll Number">

        <input type="number" id="marks" placeholder="Marks">

        <button onclick="addStudent()">Add Student</button>
    </div>

    <div class="table-box">

        <h2>Student Records</h2>

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="Search student..."
            onkeyup="displayStudents()"
        >

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll Number</th>
                    <th>Marks</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

    </div>

</div>

<script>

    let students = JSON.parse(localStorage.getItem("students")) || [];

    function addStudent() {

        const name = document.getElementById("name").value;
        const roll = document.getElementById("roll").value;
        const marks = document.getElementById("marks").value;

        if (name === "" || roll === "" || marks === "") {
            alert("Please fill all fields.");
            return;
        }

        const student = {
            name: name,
            roll: roll,
            marks: marks
        };

        students.push(student);

        localStorage.setItem("students", JSON.stringify(students));

        document.getElementById("name").value = "";
        document.getElementById("roll").value = "";
        document.getElementById("marks").value = "";

        displayStudents();
    }

    function displayStudents() {

        const table = document.getElementById("studentTable");
        const search = document.getElementById("search").value.toLowerCase();

        table.innerHTML = "";

        students.forEach(function(student, index) {

            if (student.name.toLowerCase().includes(search) ||
                student.roll.toLowerCase().includes(search)) {

                table.innerHTML += `
                    <tr>
                        <td>${student.name}</td>
                        <td>${student.roll}</td>
                        <td>${student.marks}</td>
                        <td>
                            <button class="edit-btn" onclick="editStudent(${index})">
                                Edit
                            </button>

                            <button class="delete-btn" onclick="deleteStudent(${index})">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            }
        });
    }

    function deleteStudent(index) {

        students.splice(index, 1);

        localStorage.setItem("students", JSON.stringify(students));

        displayStudents();
    }

    function editStudent(index) {

        const newName = prompt("Enter new student name:", students[index].name);
        const newRoll = prompt("Enter new roll number:", students[index].roll);
        const newMarks = prompt("Enter new marks:", students[index].marks);

        if (newName !== null && newRoll !== null && newMarks !== null) {

            students[index].name = newName;
            students[index].roll = newRoll;
            students[index].marks = newMarks;

            localStorage.setItem("students", JSON.stringify(students));

            displayStudents();
        }
    }

    displayStudents();

</script>

</body>
</html>
